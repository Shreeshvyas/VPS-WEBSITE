{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Vyas Public School</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 10px 30px -5px rgba(234, 88, 12, 0.1), 0 8px 20px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(234, 88, 12, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), #fb923c);
        }

        .logo {
            width: 120px;
            margin-bottom: 25px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        .offline-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
            display: inline-block;
            animation: wifi-bounce 2s infinite;
        }

        @keyframes wifi-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
            text-decoration: none;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-retry:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .contact-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 500;
            font-size: 14px;
            text-decoration: none;
            margin-top: 20px;
            transition: color 0.2s;
        }

        .contact-info:hover {
            color: var(--primary-hover);
        }

        .network-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 50px;
            margin-top: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            display: inline-block;
            box-shadow: 0 0 8px #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- School Logo -->
            <img src="{% static 'homepage/assets/img/lo.png' %}" alt="VPHS Logo" class="logo">
            
            <br>
            <div class="offline-icon">
                <i class="fa-solid fa-wifi-slash"></i>
            </div>
            
            <h1>You are Offline</h1>
            <p>It seems you are currently not connected to the internet. You can still access cached pages, or try refreshing when your connection is restored.</p>
            
            <button onclick="window.location.reload()" class="btn-retry">
                <i class="fa-solid fa-arrow-rotate-right"></i> Check Connection
            </button>
            
            <a href="tel:+918717860914" class="contact-info">
                <i class="fa-solid fa-phone"></i> Call School Office: +91 87178 60914
            </a>
            
            <div class="network-status">
                <span class="status-dot"></span> Offline Mode Active
            </div>
        </div>
    </div>

    <script>
        // Check internet connectivity on load
        window.addEventListener('online', () => {
            document.querySelector('.status-dot').style.backgroundColor = '#22c55e';
            document.querySelector('.status-dot').style.boxShadow = '0 0 8px #22c55e';
            document.querySelector('.network-status').childNodes[1].nodeValue = ' Online Restored! Reloading...';
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
    </script>
</body>
</html>
